    <script>
        // 🧼 内部のグラフィック構造（rectやpath等）を決して破壊せず、最外殻の<svg>タグのサイズ属性のみをクレンジングする安全な関数
        function cleanAndOptimizeSvg(rawSvg) {
            let svgCode = rawSvg.trim();
            if (!svgCode) return "";

            // 最初に現れる <svg ...> タグの開始部分（最外殻）だけを正確に特定して抽出
            const svgTagMatch = svgCode.match(/<svg[^>]*>/i);
            if (!svgTagMatch) return svgCode;

            let svgTag = svgTagMatch[0];

            // 最外殻タグの中からのみ width, height, class 属性をクレンジング（大文字小文字対応）
            svgTag = svgTag.replace(/\bwidth\s*=\s*['"][^'"]*['"]/gi, '');
            svgTag = svgTag.replace(/\bheight\s*=\s*['"][^'"]*['"]/gi, '');
            svgTag = svgTag.replace(/\bclass\s*=\s*['"][^'"]*['"]/gi, '');

            // 新たに余白なしでぴったり100%フィットさせるTailwind CSSクラスを安全に付与
            svgTag = svgTag.replace(/<svg/i, '<svg class="w-full h-full object-contain"');

            // 元のコードの最外殻部分だけをクレンジング済みのタグに差し替え（内部要素には一切干渉しない）
            svgCode = svgCode.replace(/<svg[^>]*>/i, svgTag);

            return svgCode;
        }

        // 入力時のリアルタイムプレビュー同期
        document.getElementById('svg-input').addEventListener('input', function(e) {
            const val = e.target.value.trim();
            const placeholder = document.getElementById('preview-svg-placeholder');
            if(val) {
                placeholder.innerHTML = cleanAndOptimizeSvg(val);
            } else {
                placeholder.innerHTML = `左側のテキストエリアに<br>SVGコードを入力すると、<br>ここに640pxサイズでフィット表示されます。`;
            }
        });

        // 🌟 連動完成品HTMLの文字列を動的生成してダウンロードさせる関数
        function generateAndDownloadButtonHtml() {
            const svgRawSource = document.getElementById('svg-input').value.trim();
            if(!svgRawSource) {
                alert('先にSVGコードをペーストしてください。');
                return;
            }

            const svgOptimized = cleanAndOptimizeSvg(svgRawSource);

            // 出力用HTMLソースコードの組み立て（p-6を完全に排除し、枠線いっぱいに密着させる構造）
            const outputHtml = `<!DOCTYPE html>

        @keyframes plipNobleFloatSVG { 0% { transform: translate3d(0, 0px, 0) rotate(0.001deg); } 50% { transform: translate3d(0, 2px, 0) rotate(0.001deg); } 100% { transform: translate3d(0, 0px, 0) rotate(0.001deg); } }

                <g class="animated-bubble-container-svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
                    <path d="M 6 8 H 42 L 48 3 L 54 8 H 90 A 4 4 0 0 1 94 12 V 29 A 4 4 0 0 1 90 33 H 6 A 4 4 0 0 1 2 29 V 12 A 4 4 0 0 1 6 8 Z" fill="#151d30" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.85" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.4))" />
                    <g transform="translate(6, 11) scale(0.85)">
                        <g stroke="#fbbf24" stroke-linecap="round" stroke-width="1.2" opacity="0.55"><line x1="8" y1="1" x2="8" y2="3" /><line x1="3" y1="3" x2="4.5" y2="4.5" /><line x1="1" y1="8" x2="3" y2="8" /><line x1="3" y1="13" x2="4.5" y2="11.5" /><line x1="13" y1="11.5" x2="11.5" y2="10" /><line x1="15" y1="8" x2="13" y2="8" /><line x1="13" y1="3" x2="11.5" y2="4.5" /></g>

                        <path d="M4.7,13.8 H11.3 V15.5 C11.3,16 10.9,16.5 10.3,16.5 H5.7 C5.1,16.5 4.7,16 4.7,15.5 Z" fill="#94a3b8" stroke="#334155" stroke-width="0.5" />

                </g>
            </svg>
        </div>

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-20px] opacity-0 pointer-events-none transition-all duration-300 bg-slate-900 border border-slate-800 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium">
        <span id="toast-icon" class="text-emerald-400"><i class="fa-solid fa-circle-check"></i></span>
        <span id="toast-text">通知</span>
    </div>

    <script>
        let currentCoreStyleState = 0; // 0:金枠, 1:銀枠, 2:赤枠
        let audioBgmIframe = null;     // 金枠用（BGM.html）
        let audioMediaElement = null;  // 銀枠用（song*.mp4）

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = message;
            const icon = document.getElementById('toast-icon');
            icon.innerHTML = isSuccess ? '<i class="fa-solid fa-circle-check"><\/i>' : '<i class="fa-solid fa-volume-xmark"><\/i>';
            icon.className = isSuccess ? 'text-emerald-400' : 'text-rose-400';
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 2500);
        }

        function triggerCoreBurstInterlocking() {
            playClickClickSound();
            currentCoreStyleState = (currentCoreStyleState + 1) % 3;
            applyCoreBurstStyleAndMusic();
        }

        function playClickClickSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.03);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.03);
            } catch (e) {
                console.warn("SE生成失敗:", e);
            }
        }

        async function applyCoreBurstStyleAndMusic() {
            const btn = document.getElementById('jinsei-core-btn');
            if (!btn) return;

            if (audioBgmIframe) { audioBgmIframe.remove(); audioBgmIframe = null; }
            if (audioMediaElement) { audioMediaElement.pause(); audioMediaElement.remove(); audioMediaElement = null; }

            if (currentCoreStyleState === 0) {
                btn.style.borderColor = '#FFD700';
                btn.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.4)';
                showToast('⚡️ 金枠の陣：テーマ曲を起動 (BGM on!)');

                audioBgmIframe = document.createElement('iframe');
                audioBgmIframe.src = './music/BGM.html';
                audioBgmIframe.style.display = 'none';
                audioBgmIframe.setAttribute('allow', 'autoplay');
                document.body.appendChild(audioBgmIframe);

            } else if (currentCoreStyleState === 1) {
                btn.style.borderColor = '#E2E8F0';
                btn.style.boxShadow = '0 0 20px rgba(226, 232, 240, 0.4)';

                const songCandidates = [
                    './music/song.mp4', './music/song1.mp4', './music/song2.mp4', './music/song3.mp4', './music/song4.mp4'
                ];
                const availableSongs = [];

                await Promise.all(songCandidates.map(async (url) => {
                    try {
                        const response = await fetch(url, { method: 'HEAD' });
                        if (response.ok) availableSongs.push(url);
                    } catch (e) {}
                }));

                if (availableSongs.length === 0) availableSongs.push('./music/song.mp4');

                const chosenSong = availableSongs[Math.floor(Math.random() * availableSongs.length)];
                const songFileName = chosenSong.substring(chosenSong.lastIndexOf('/') + 1);
                showToast('🎵 銀枠の陣：抽選曲 [' + songFileName + '] を爆音再生！');

                audioMediaElement = document.createElement('audio');
                audioMediaElement.src = chosenSong;
                audioMediaElement.style.display = 'none';
                audioMediaElement.volume = 0.5;
                audioMediaElement.loop = false;
                
                audioMediaElement.addEventListener('ended', () => {
                    currentCoreStyleState = 0;
                    applyCoreBurstStyleAndMusic();
                });

                document.body.appendChild(audioMediaElement);
                audioMediaElement.play().catch(e => console.warn("自動再生制限制限:", e));

            } else if (currentCoreStyleState === 2) {
                btn.style.borderColor = '#EF4444';
                btn.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.4)';
                showToast('🤫 赤枠の陣：静寂の世界 (音声 off!)', false);
            }
        }
    <\/script>
</body>

            const blob = new Blob([outputHtml], { type: 'text/html;charset=utf-8;' });

            document.body.appendChild(link);

            document.body.removeChild(link);
        }
    </script>
