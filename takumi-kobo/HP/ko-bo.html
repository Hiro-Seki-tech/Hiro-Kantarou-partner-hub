<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ PLIP 匠工房 - Tool Hub & Generator Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800;900&family=Noto+Sans+JP:wght=300;400;500;700;900&family=Cinzel:wght=500;700;900&family=Shippori+Mincho:wght=500;700;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: #030712;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .cosmic-radial {
            background: radial-gradient(circle at 50% -20%, #111827 0%, #030712 80%);
        }

        /* PLIP コアバースト用 レインボーアニメーション */
        @keyframes coreRainbowShift {
            0% { color: #ff0055; filter: drop-shadow(0 0 4px rgba(255, 0, 85, 0.6)); }
            14% { color: #ff5500; filter: drop-shadow(0 0 4px rgba(255, 85, 0, 0.6)); }
            28% { color: #ffcc00; filter: drop-shadow(0 0 4px rgba(255, 204, 0, 0.6)); }
            42% { color: #00ff66; filter: drop-shadow(0 0 4px rgba(0, 255, 102, 0.6)); }
            57% { color: #00ccff; filter: drop-shadow(0 0 4px rgba(0, 204, 255, 0.6)); }
            71% { color: #3333ff; filter: drop-shadow(0 0 4px rgba(51, 51, 255, 0.6)); }
            85% { color: #9900ff; filter: drop-shadow(0 0 4px rgba(153, 0, 255, 0.6)); }
            100% { color: #ff0055; filter: drop-shadow(0 0 4px rgba(255, 0, 85, 0.6)); }
        }
        .animate-core-rainbow {
            animation: coreRainbowShift 6s linear infinite;
        }

        @keyframes plipRainbowTextSVG { 
            0% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255, 0, 85, 0.5)); } 
            14% { fill: #ff5500; filter: drop-shadow(0 0 3px rgba(255, 85, 0, 0.5)); } 
            28% { fill: #ffcc00; filter: drop-shadow(0 0 3px rgba(255, 204, 0, 0.5)); } 
            42% { fill: #00ff66; filter: drop-shadow(0 0 3px rgba(0, 255, 102, 0.5)); } 
            50% { fill: #00ccff; filter: drop-shadow(0 0 3px rgba(0, 204, 255, 0.5)); } 
            70% { fill: #3333ff; filter: drop-shadow(0 0 3px rgba(51, 51, 255, 0.5)); } 
            84% { fill: #9900ff; filter: drop-shadow(0 0 3px rgba(153, 0, 255, 0.5)); } 
            100% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255, 0, 85, 0.5)); } 
        }
        @keyframes plipBoltFlashSVG { 
            0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 1px #fde047); } 
            50% { opacity: 1; filter: drop-shadow(0 0 5px #fde047); } 
        }
        
        .rainbow-bulb-svg { animation: plipRainbowTextSVG 7s linear infinite; }
        .flashing-bolt-svg { animation: plipBoltFlashSVG 1.5s infinite ease-in-out; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="min-h-screen flex flex-col cosmic-radial selection:bg-amber-500/30 selection:text-white antialiased">

        </div>
    </main>

    <!-- 🎴 カード追加・編集モーダル (z-index最前面完全保護) -->

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-2xl max-h-[92vh] overflow-y-auto shadow-2xl relative flex flex-col gap-4 z-[210]">

            <input type="hidden" id="modal-cat-id">
            <input type="hidden" id="modal-card-index">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>

                    { "title": "yourPLIPページ", "url": "#", "desc": "エンドユーザーや外部共有向けに知的財産をスマートに提示するインフォメーションダッシュボード。", "icon": "custom-free|fa-solid fa-display|text-indigo-400|none|none|none" },
                    { "title": "PLIPリンクページ", "url": "#", "desc": "各種ポータルやFinTech・エンタメ系への経路を高速展開するためのリンクナビゲーション。", "icon": "custom-free|fa-solid fa-link|text-blue-400|none|none|none" },
                    { "title": "匠工房ページ", "url": "#", "desc": "現在表示中である、開発ツールの生産性向上を司る編集可能コントロールセンターシステム。", "icon": "custom-free|fa-solid fa-screwdriver-wrench|text-amber-500|none|none|none" }
                ]
            }
        ];

        const plipEmbeddedBase64Data = "";

        // Font Awesome 拡張ライブラリ一覧
        const fontAwesomeIconLibrary = [
            "fa-solid fa-screwdriver-wrench", "fa-solid fa-hammer", "fa-solid fa-wrench", "fa-solid fa-gear",
            "fa-solid fa-laptop-code", "fa-solid fa-code", "fa-solid fa-terminal", "fa-solid fa-microchip",
            "fa-solid fa-wand-magic-sparkles", "fa-solid fa-icons", "fa-solid fa-link", "fa-solid fa-comment-dots",
            "fa-solid fa-coins", "fa-solid fa-vault", "fa-solid fa-chart-line", "fa-solid fa-mountain", "fa-solid fa-mountain-city",
            "fa-solid fa-building", "fa-solid fa-city", "fa-solid fa-house", "fa-solid fa-tower-cell",
            "fa-solid fa-user-astronaut", "fa-solid fa-heart-pulse", "fa-solid fa-display", "fa-solid fa-window-restore",
            "fa-solid fa-circle-user", "fa-solid fa-cubes", "fa-solid fa-robot", "fa-solid fa-flask",
            "fa-solid fa-database", "fa-solid fa-server", "fa-solid fa-shield-halved", "fa-solid fa-key",
            "fa-solid fa-puzzle-piece", "fa-solid fa-gamepad", "fa-solid fa-compass", "fa-solid fa-sliders",
            "fa-solid fa-palette", "fa-solid fa-pen-nib", "fa-solid fa-lightbulb", "fa-solid fa-bolt"
        ];

        const colorPaletteList = [
            { label: "アンバー", value: "text-amber-400" },
            { label: "イエロー", value: "text-yellow-300" },
            { label: "スカイ", value: "text-sky-400" },
            { label: "ブルー", value: "text-blue-500" },
            { label: "エメラルド", value: "text-emerald-400" },
            { label: "グリーン", value: "text-green-400" },
            { label: "ローズ", value: "text-rose-500" },
            { label: "パープル", value: "text-purple-400" },
            { label: "ホワイト", value: "text-white" },
            { label: "スレート", value: "text-slate-400" }
        ];

        // フリーカスタム状態保持用ステート変数
        let curBaseIcon = "fa-solid fa-screwdriver-wrench";
        let curBaseColor = "text-amber-400";
        let curOverlayIcon = "none";
        let curOverlayColor = "none";
        let curSpecialFX = "none";

        // パッキングされた文字列の完全解析レンダラー (完全な後方互換対応)
        function parseIconStringToHTML(iconStr) {
            if (!iconStr) return `<i class="fa-solid fa-screwdriver-wrench text-amber-400"></i>`;
            
            const parts = iconStr.split('|');
            
            // 1. 新フリーカスタム仕様の解析
            if (parts[0] === 'custom-free') {
                const bIcon = parts[1] || 'fa-solid fa-wrench';
                const bColor = parts[2] || 'text-amber-400';
                const oIcon = parts[3] || 'none';
                const oColor = parts[4] || 'none';
                const fx = parts[5] || 'none';

                const fxClass = (fx !== 'none') ? fx : '';
                
                if (oIcon === 'none') {
                    return `<i class="${bIcon} ${bColor} ${fxClass}"></i>`;
                } else {
                    // 富土山などのスケール最適化用微調整
                    let baseScale = (bIcon === 'fa-solid fa-mountain') ? 'text-[1.15em] translate-x-[-3px] translate-y-[-1px]' : '';
                    let subScale = (bIcon === 'fa-solid fa-mountain') ? 'text-[0.65em] bottom-1 right-1' : 'text-[0.55em] top-0.5 right-0.5';
                    
                    return `
                        <div class="relative w-full h-full flex items-center justify-center select-none overflow-visible">
                            <i class="${bIcon} ${bColor} ${fxClass} ${baseScale}"></i>
                            <i class="${oIcon} ${oColor} absolute ${subScale} drop-shadow-md"></i>
                        </div>
                    `;
                }
            }

            // 2. 前世代のプリセット指定との前方互換コンバート処理
            if (parts[0] === 'custom-plip-core') {
                return `
                    <div class="relative w-full h-full flex items-center justify-center select-none">
                        <i class="fa-solid fa-lightbulb animate-core-rainbow"></i>
                        <i class="fa-solid fa-bolt absolute top-0.5 right-0.5 text-[0.55em] text-yellow-300"></i>
                    </div>
                `;
            }
            if (parts[0] === 'custom-fudosan') {
                const mC = parts[1] || 'text-emerald-400';
                const bC = parts[2] || 'text-amber-300';
                return `
                    <div class="relative w-full h-full flex items-center justify-center select-none">
                        <i class="fa-solid fa-mountain ${mC} text-[1.15em] translate-x-[-3px] translate-y-[-1px]"></i>
                        <i class="fa-solid fa-building ${bC} absolute bottom-1 right-1 text-[0.65em]"></i>
                    </div>
                `;
            }

            // 3. 最も古いプレーン文字列仕様との互換
            const colorClass = parts[1] || 'text-amber-400';
            return `<i class="${parts[0]} ${colorClass}"></i>`;
        }

        // LocalStorageおよび同期コア
        function saveToLocalStorage() {
            try {
                localStorage.setItem('plip_takumi_master_data', JSON.stringify(plipMasterData));
            } catch (e) {
                console.error("LocalStorage保存失敗:", e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('plip_takumi_master_data');
                if (saved) plipMasterData = JSON.parse(saved);
            } catch (e) {
                console.error("LocalStorage読込失敗:", e);
            }
            if (typeof plipEmbeddedBase64Data !== 'undefined' && plipEmbeddedBase64Data !== "") {
                try {
                    const decoded = decodeURIComponent(escape(atob(plipEmbeddedBase64Data)));
                    if(decoded) plipMasterData = JSON.parse(decoded);
                } catch (e) {
                    console.error("Base64読込失敗:", e);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            buildInteractiveGrids();
            buildColorPalettes();
            buildUI();
        });

        // 編集用コントロールUI構築
        function buildInteractiveGrids() {
            const baseGrid = document.getElementById('base-icon-grid');
            const overlayGrid = document.getElementById('overlay-icon-grid');
            if (!baseGrid || !overlayGrid) return;

            baseGrid.innerHTML = '';
            overlayGrid.innerHTML = '';

            fontAwesomeIconLibrary.forEach(iconClass => {
                // 土台用ボタン
                const btnB = document.createElement('button');
                btnB.type = 'button';
                btnB.className = "p-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg flex items-center justify-center text-sm text-slate-400 hover:text-amber-400 transition-all active:scale-95";
                btnB.innerHTML = `<i class="${iconClass}"></i>`;
                btnB.onclick = () => { curBaseIcon = iconClass; syncPackedState(); playMechanicalClick(); };
                baseGrid.appendChild(btnB);

                // 重ね合わせ用ボタン
                const btnO = document.createElement('button');
                btnO.type = 'button';
                btnO.className = "p-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg flex items-center justify-center text-sm text-slate-400 hover:text-sky-400 transition-all active:scale-95";
                btnO.innerHTML = `<i class="${iconClass}"></i>`;
                btnO.onclick = () => { 
                    curOverlayIcon = iconClass; 
                    if(curOverlayColor === 'none') curOverlayColor = 'text-sky-400';
                    syncPackedState(); 
                    playMechanicalClick(); 
                };
                overlayGrid.appendChild(btnO);
            });
        }

        function buildColorPalettes() {
            const basePalette = document.getElementById('base-color-palette');
            const overlayPalette = document.getElementById('overlay-color-palette');

            const initPalette = (container, targetSetter) => {
                if (!container) return;
                container.innerHTML = '';
                colorPaletteList.forEach(c => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `w-5 h-5 rounded-full border border-slate-800 ${c.value} bg-slate-950 flex items-center justify-center text-[8px] hover:scale-110 transition-transform`;
                    btn.innerHTML = `●`;
                    btn.onclick = () => { targetSetter(c.value); syncPackedState(); };
                    container.appendChild(btn);
                });
            };

            initPalette(basePalette, (val) => { curBaseColor = val; });
            initPalette(overlayPalette, (val) => { curOverlayColor = val; });
        }

        function clearOverlayIcon() {
            curOverlayIcon = "none";
            curOverlayColor = "none";
            syncPackedState();
            playMechanicalClick();
        }

        function toggleSpecialFX(fxType) {
            curSpecialFX = fxType;
            const bNone = document.getElementById('btn-fx-none');
            const bRainbow = document.getElementById('btn-fx-rainbow');
            
            if(fxType === 'none') {
                bNone.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400";
                bRainbow.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-400";
            } else {
                bNone.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-400";
                bRainbow.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-purple-500 bg-purple-500/10 text-purple-400";
            }
            syncPackedState();
            playMechanicalClick();
        }

        // ステートから文字列をパッキングしてUIと同期
        function syncPackedState() {
            const packed = `custom-free|${curBaseIcon}|${curBaseColor}|${curOverlayIcon}|${curOverlayColor}|${curSpecialFX}`;
            document.getElementById('modal-card-icon').value = packed;
            document.getElementById('modal-icon-preview-container').innerHTML = parseIconStringToHTML(packed);
            
            // FXボタンのクラス適正化同期
            const bNone = document.getElementById('btn-fx-none');
            const bRainbow = document.getElementById('btn-fx-rainbow');
            if(curSpecialFX === 'none') {
                bNone.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400";
                bRainbow.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-400";
            } else {
                bNone.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-400";
                bRainbow.className = "text-[11px] font-bold px-3 py-1.5 rounded-xl border border-purple-500 bg-purple-500/10 text-purple-400";
            }
        }

        // 文字列から分解してステートに戻す
        function unpackStateFromData(iconStr) {
            if (!iconStr) iconStr = "custom-free|fa-solid fa-screwdriver-wrench|text-amber-400|none|none|none";
            const parts = iconStr.split('|');

            if (parts[0] === 'custom-free') {
                curBaseIcon = parts[1] || 'fa-solid fa-wrench';
                curBaseColor = parts[2] || 'text-amber-400';
                curOverlayIcon = parts[3] || 'none';
                curOverlayColor = parts[4] || 'none';
                curSpecialFX = parts[5] || 'none';
            } else if (parts[0] === 'custom-plip-core') {
                curBaseIcon = "fa-solid fa-lightbulb";
                curBaseColor = "text-white";
                curOverlayIcon = "fa-solid fa-bolt";
                curOverlayColor = "text-yellow-300";
                curSpecialFX = "animate-core-rainbow";
            } else if (parts[0] === 'custom-fudosan') {
                curBaseIcon = "fa-solid fa-mountain";
                curBaseColor = parts[1] || "text-emerald-400";
                curOverlayIcon = "fa-solid fa-building";
                curOverlayColor = parts[2] || "text-amber-300";
                curSpecialFX = "none";
            } else {
                curBaseIcon = parts[0] || "fa-solid fa-wrench";
                curBaseColor = parts[1] || "text-amber-400";
                curOverlayIcon = "none";
                curOverlayColor = "none";
                curSpecialFX = "none";
            }
            syncPackedState();
        }

        function closeModalOnOuterClick(event, modalId) {
            if (event.target.id === modalId) {
                if (modalId === 'card-modal') closeCardModal();
                if (modalId === 'category-modal') closeCategoryModal();
            }
        }

        // 動的UI構築コア
        function buildUI() {
            const tabsContainer = document.getElementById('category-tabs-container');
            const contentContainer = document.getElementById('main-content-container');
            const isEditMode = !!document.getElementById('generator-control-bar');

            tabsContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            plipMasterData.forEach((cat, catIdx) => {
                const tabBtn = document.createElement('button');
                tabBtn.className = `px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all ${catIdx === 0 ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20 shadow-md' : 'text-slate-400 hover:text-slate-200'}`;
                tabBtn.setAttribute('onclick', `scrollToCategory('${cat.id}')`);
                tabBtn.innerHTML = `<i class="${cat.icon || 'fa-solid fa-folder'}"></i> ${cat.title}`;
                tabsContainer.appendChild(tabBtn);

                const sec = document.createElement('div');
                sec.id = cat.id;
                sec.className = "flex flex-col gap-6 relative group/sec pt-4";

                let catAdminBar = '';
                if (isEditMode) {
                    catAdminBar = `
                    <div class="flex gap-2 mb-1 bg-slate-900/90 border border-slate-800 p-1.5 rounded-xl max-w-fit shadow-md">
                        <button onclick="openCategoryModal(${catIdx})" class="text-[11px] font-bold text-sky-400 hover:text-sky-300 px-2 py-0.5"><i class="fa-solid fa-pen-to-square"></i> 工房名構成編集</button>
                        <button onclick="deleteCategory(${catIdx})" class="text-[11px] font-bold text-rose-500 hover:text-rose-400 px-2 py-0.5"><i class="fa-solid fa-trash"></i> 削除</button>
                    </div>`;
                }

                sec.innerHTML = `
                    ${catAdminBar}
                    <div class="border-b border-slate-800 pb-3">
                        <h2 class="text-lg sm:text-xl font-bold tracking-wider flex items-center gap-2 text-amber-400" style="font-family: 'Cinzel', 'Noto Sans JP', serif;">
                            <i class="${cat.icon || 'fa-solid fa-folder'} text-xl"></i> ${cat.title} 
                            <span class="text-xs text-slate-500 font-mono font-medium tracking-normal">${cat.sub}</span>
                        </h2>
                    </div>
                `;

                const gridContainer = document.createElement('div');
                gridContainer.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

                if (cat.cards.length === 0) {
                    const emptyBlock = document.createElement('div');
                    emptyBlock.className = "col-span-full bg-slate-950/40 border border-dashed border-slate-800 rounded-3xl p-8 text-center text-slate-500 text-xs";
                    emptyBlock.innerHTML = `<p><i class="fa-solid fa-folder-open mr-1"></i> 工房ツールが未登録です。下の追加枠から新規カードを創生してください。</p>`;
                    gridContainer.appendChild(emptyBlock);
                } else {
                    cat.cards.forEach((card, cardIdx) => {
                        const cardWrapper = document.createElement('div');
                        cardWrapper.className = "relative bg-gradient-to-br from-slate-950 via-slate-950 to-slate-900 border border-slate-900 rounded-3xl p-5 sm:p-6 shadow-xl flex gap-5 items-start hover:border-slate-800 transition-all duration-300 group/card overflow-hidden";

                        if (isEditMode) {
                            const isFirst = cardIdx === 0;
                            const isLast = cardIdx === cat.cards.length - 1;
                            const cardAdminOverlay = document.createElement('div');
                            cardAdminOverlay.className = "absolute top-3 right-3 z-30 flex gap-1.5 opacity-40 group-hover/card:opacity-100 transition-opacity";
                            cardAdminOverlay.innerHTML = `
                                ${!isFirst ? `<button onclick="moveCard(${catIdx}, ${cardIdx}, -1)" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-[10px] px-2 py-0.5 rounded"><i class="fa-solid fa-chevron-up"></i></button>` : ''}
                                ${!isLast ? `<button onclick="moveCard(${catIdx}, ${cardIdx}, 1)" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-[10px] px-2 py-0.5 rounded"><i class="fa-solid fa-chevron-down"></i></button>` : ''}
                                <button onclick="openCardModal('${cat.id}', ${cardIdx})" class="bg-sky-600 hover:bg-sky-500 text-white text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-marker"></i> 編集</button>
                                <button onclick="deleteCard(${catIdx}, ${cardIdx})" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-trash-can"></i> 削除</button>
                            `;
                            cardWrapper.appendChild(cardAdminOverlay);
                        }

                        const iconSlot = document.createElement('div');
                        iconSlot.className = "w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 flex items-center justify-center shrink-0 text-2xl sm:text-3xl text-amber-400 shadow-inner transition-colors duration-300 mt-1 select-none overflow-visible relative";
                        iconSlot.innerHTML = parseIconStringToHTML(card.icon);

                        const infoSlot = document.createElement('div');
                        infoSlot.className = "flex flex-col flex-grow justify-between min-h-[4rem] sm:min-h-[5rem]";
                        infoSlot.innerHTML = `
                            <div>
                                <h3 class="text-base sm:text-lg font-bold text-white pr-20" style="font-family: 'Shippori Mincho', serif;">
                                    ${card.title}
                                </h3>
                                <p class="text-xs text-slate-400 font-light leading-relaxed mt-1.5 pr-2">
                                    ${card.desc || '解説未設定。'}
                                </p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-900/60 flex items-center justify-end">
                                <a href="${card.url || '#'}" ${card.url && card.url !== '#' ? 'target="_blank" rel="noopener noreferrer"' : ''} class="px-4 py-1.5 rounded-xl bg-slate-900 hover:bg-amber-500 border border-slate-800 text-slate-300 hover:text-slate-950 text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
                                    工房ツール起動 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </a>
                            </div>
                        `;

                        cardWrapper.appendChild(iconSlot);
                        cardWrapper.appendChild(infoSlot);
                        gridContainer.appendChild(cardWrapper);
                    });
                }

                if (isEditMode) {
                    const addCardBox = document.createElement('div');
                    addCardBox.className = "border border-dashed border-slate-800 hover:border-amber-500/40 rounded-3xl p-5 flex items-center justify-center cursor-pointer transition-all bg-slate-950/10 hover:bg-slate-950/30";
                    addCardBox.setAttribute('onclick', `openCardModal('${cat.id}', -1)`);
                    addCardBox.innerHTML = `<p class="text-xs text-slate-500 font-bold hover:text-amber-400"><i class="fa-solid fa-circle-plus mr-1"></i> このエリアに新規ツールを配置</p>`;
                    gridContainer.appendChild(addCardBox);
                }

                sec.appendChild(gridContainer);
                contentContainer.appendChild(sec);
            });
        }

        function scrollToCategory(elementId) {
            const el = document.getElementById(elementId);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function moveCard(catIdx, cardIdx, direction) {
            const cards = plipMasterData[catIdx].cards;
            const targetIdx = cardIdx + direction;
            if (targetIdx < 0 || targetIdx >= cards.length) return;
            [cards[cardIdx], cards[targetIdx]] = [cards[targetIdx], cards[cardIdx]];
            buildUI();
            saveToLocalStorage();
            showToast("↕️ ツールの配置順序を更新しました。");
        }

        function openCardModal(catId, cardIdx) {
            document.getElementById('modal-cat-id').value = catId;
            document.getElementById('modal-card-index').value = cardIdx;
            
            if (cardIdx === -1) {
                document.getElementById('modal-card-title').value = '';
                document.getElementById('modal-card-url').value = '';
                document.getElementById('modal-card-desc').value = '';
                unpackStateFromData('custom-free|fa-solid fa-screwdriver-wrench|text-amber-400|none|none|none');
                document.getElementById('modal-card-header-title').textContent = "🛠️ 新規ツールの創生";
            } else {
                const cat = plipMasterData.find(c => c.id === catId);
                const card = cat.cards[cardIdx];
                document.getElementById('modal-card-title').value = card.title;
                document.getElementById('modal-card-url').value = card.url === '#' ? '' : card.url;
                document.getElementById('modal-card-desc').value = card.desc;
                unpackStateFromData(card.icon);
                document.getElementById('modal-card-header-title').textContent = "🛠️ ツールの仕様変更";
            }
            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        function saveCardData() {
            const catId = document.getElementById('modal-cat-id').value;
            const cardIdx = parseInt(document.getElementById('modal-card-index').value);
            const title = document.getElementById('modal-card-title').value.trim();
            let url = document.getElementById('modal-card-url').value.trim();
            const desc = document.getElementById('modal-card-desc').value.trim();
            const icon = document.getElementById('modal-card-icon').value;

            if (!title) {
                alert("ツール名称の入力は必須です。");
                return;
            }
            if (!url) url = '#';

            const cat = plipMasterData.find(c => c.id === catId);
            const cardObj = { title, url, desc, icon };

            if (cardIdx === -1) {
                cat.cards.push(cardObj);
            } else {
                cat.cards[cardIdx] = cardObj;
            }

            closeCardModal();
            buildUI();
            saveToLocalStorage();
            showToast("💾 ツールの匠設定を完全保存しました。");
        }

        function deleteCard(catIdx, cardIdx) {
            if (confirm("このツールカードを工房から撤去しますか？")) {
                plipMasterData[catIdx].cards.splice(cardIdx, 1);
                buildUI();
                saveToLocalStorage();
                showToast("❌ ツールカードを削除しました。");
            }
        }

        function openCategoryModal(catIdx = -1) {
            document.getElementById('modal-cat-index').value = catIdx;
            if (catIdx === -1) {
                document.getElementById('modal-cat-id-name').value = '';
                document.getElementById('modal-cat-title').value = '';
                document.getElementById('modal-cat-sub').value = '';
                document.getElementById('modal-cat-icon').value = 'fa-solid fa-folder';
                document.getElementById('modal-cat-id-name').disabled = false;
            } else {
                const cat = plipMasterData[catIdx];
                document.getElementById('modal-cat-id-name').value = cat.id;
                document.getElementById('modal-cat-title').value = cat.title;
                document.getElementById('modal-cat-sub').value = cat.sub;
                document.getElementById('modal-cat-icon').value = cat.icon || 'fa-solid fa-folder';
                document.getElementById('modal-cat-id-name').disabled = true;
            }
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
        }

        function saveCategoryData() {
            const catIdx = parseInt(document.getElementById('modal-cat-index').value);
            const id = document.getElementById('modal-cat-id-name').value.trim();
            const title = document.getElementById('modal-cat-title').value.trim();
            const sub = document.getElementById('modal-cat-sub').value.trim();
            const icon = document.getElementById('modal-cat-icon').value.trim();

            if (!id || !title) {
                alert("識別IDとカテゴリ名は必須です。");
                return;
            }

            if (catIdx === -1) {
                plipMasterData.push({
                    id, title,
                    sub: sub || "NEW STUDIO",
                    icon: icon || "fa-solid fa-folder",
                    cards: []
                });
            } else {
                plipMasterData[catIdx].title = title;
                plipMasterData[catIdx].sub = sub;
                plipMasterData[catIdx].icon = icon;
            }

            closeCategoryModal();
            buildUI();
            saveToLocalStorage();
            showToast("📂 工房カテゴリ構成を保存しました。");
        }

        function deleteCategory(catIdx) {
            if (confirm("カテゴリ工房を削除すると内包されるツール情報もすべて消失します。実行しますか？")) {
                plipMasterData.splice(catIdx, 1);
                buildUI();
                saveToLocalStorage();
                showToast("❌ 工房カテゴリを完全削除しました。");
            }
        }

        function exportHTML(isForEdit) {
            const cleanDoc = document.implementation.createHTMLDocument(document.title);
            cleanDoc.documentElement.innerHTML = document.documentElement.outerHTML;

            const tabs = cleanDoc.querySelector('#category-tabs-container');
            const content = cleanDoc.querySelector('#main-content-container');
            if (tabs) tabs.innerHTML = '';
            if (content) content.innerHTML = '';

            const cardM = cleanDoc.querySelector('#card-modal');
            const catM = cleanDoc.querySelector('#category-modal');
            if (cardM) cardM.className = "fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4 overflow-y-auto";
            if (catM) catM.className = "fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4 shadow-2xl";

            const scriptEl = cleanDoc.querySelector('script:not([src])');
            if (scriptEl) {
                let jsCode = scriptEl.textContent;
                const rawJson = JSON.stringify(plipMasterData);
                const base64Data = btoa(unescape(encodeURIComponent(rawJson)));
                
                const regexData = /let\s+plipMasterData\s*=\s*\[[\s\S]*?\]\s*;/;
                jsCode = jsCode.replace(regexData, `let plipMasterData = [];\n        const plipEmbeddedBase64Data = "${base64Data}";`);
                scriptEl.textContent = jsCode;
            }

            if (!isForEdit) {
                const removeSelectors = ['#generator-control-bar', '#add-category-zone', '#card-modal', '#category-modal'];
                removeSelectors.forEach(sel => {
                    const el = cleanDoc.querySelector(sel);
                    if (el) el.remove();
                });
            }

            const finalHtml = '<!DOCTYPE html>\n' + cleanDoc.documentElement.outerHTML;
            const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8;" });
            const link = document.createElement("a");
            const filename = isForEdit ? "PLIP_TAKUMI_KOBO_edit.html" : "PLIP_TAKUMI_KOBO_production.html";
            
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            cleanDoc.body.appendChild(link);
            link.click();

            showToast(isForEdit ? "💾 編集機能を維持したHTMLアセットを保存しました。" : "🚀 外部公開用のクリーンなHTMLをビルド出力しました！");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 3000);
        }

        function playMechanicalClick() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.012);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.012);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.012);
            } catch (e) {}
        }
    </script>
</body>
